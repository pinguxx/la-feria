name: CI / Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Backend (Fmt, Clippy, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Verify Rust Standalone Bundler
        run: |
          cargo run --bin bundle
          test -f dist/la_feria_standalone.html
          echo "✓ Standalone single-file bundle generated successfully"

  frontend-check:
    name: Frontend Syntax & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c public/app.js
          node -c public/feria-bridge.js
          echo "✓ All frontend JS assets validated without syntax errors"

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: la-feria:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
